<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>HiChord para iPhone</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HiChord">
<meta name="theme-color" content="#f4f3f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f0;--ctl:#e9e7e2;--ctl2:#e2e0da;--line:#dcdad4;--ink:#1d1d1f;--txt:#3d3f44;--mut:#6b6d72;--red:#dc3b30;--paper:#fbfaf8;--play:#e6e3dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35}

/* ---------- layout: portrait ---------- */
#app{position:fixed;inset:0;display:grid;gap:7px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px);
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(110px,1fr) auto auto auto auto auto clamp(214px,37vh,330px);
  grid-template-areas:"screen" "bar" "modes" "chord" "joym" "loop" "play"}
#topbar{display:contents}
#screenWrap{grid-area:screen;position:relative;border-radius:18px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 #fff;overflow:hidden;min-height:0}
#scr{position:absolute;inset:0;width:100%;height:100%}
#helpBtn{position:absolute;right:4px;top:4px;width:40px;height:40px;border-radius:12px;color:var(--mut);display:flex;align-items:center;justify-content:center}
#bar{grid-area:bar;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.big{height:46px;border-radius:13px;background:var(--ctl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0}
.big small{font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--mut)}
.big b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px}
.big.tap{font-size:14px;font-weight:700;letter-spacing:1px}
#modes{grid-area:modes;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -8px;padding:0 8px;touch-action:pan-x}
#modes::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:42px;padding:0 15px;border-radius:21px;background:var(--ctl);color:var(--txt);font-size:13px;font-weight:600}
.chip.sel{background:var(--ink);color:#fff;font-weight:700}
#chord{grid-area:chord;display:flex;gap:6px;height:44px}
.seg{display:grid;background:var(--ctl);border-radius:12px;padding:3px;gap:3px}
.seg button{border-radius:9px;color:var(--txt);font-size:12px;font-weight:600;min-width:0}
.seg button.sel{background:var(--ink);color:#fff;font-weight:700}
#inv{flex:1 1 0;grid-template-columns:repeat(3,minmax(0,1fr))}
#oct{display:flex;align-items:center;background:var(--ctl);border-radius:12px;padding:3px}
#oct button{width:38px;height:38px;border-radius:9px;font-size:20px;font-weight:600}
#oct span{width:30px;text-align:center;font-size:10px;font-weight:700;color:var(--mut);line-height:1.2}
#lock{width:44px;border-radius:12px;background:var(--ctl);display:flex;align-items:center;justify-content:center}
#lock.on{background:var(--ink);color:#fff}
#joym{grid-area:joym;grid-template-columns:repeat(5,minmax(0,1fr));height:40px}
#joym button{font-size:11px}
.seg .s{display:none}
#loop{grid-area:loop;display:flex;gap:4px;height:44px;align-items:stretch}
#tracks{display:flex;gap:4px;flex:1 1 auto;min-width:0}
.trk{flex:1 1 0;min-width:28px;max-width:44px;border-radius:10px;background:var(--ctl);color:#8a8c91;display:flex;align-items:center;justify-content:center;position:relative}
.trk svg{width:13px;height:13px}
.trk svg *{fill:none;stroke:currentColor;stroke-width:2}
.trk.has{background:var(--ctl2);color:var(--ink)}
.trk.has svg *,.trk.rec svg *{fill:currentColor}
.trk.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.trk.rec{background:#fde4e1;color:var(--red);box-shadow:inset 0 0 0 2px #e5483b}
.trk.arm{box-shadow:inset 0 0 0 2px #e5483b}
.trk.mute{opacity:.45}
#transport{display:flex;gap:4px;margin-left:auto}
#rec{width:48px;border-radius:24px;background:radial-gradient(circle at 45% 30%,#ff8a7c,#dc3b30 70%);box-shadow:0 3px 0 #8e241c;display:flex;align-items:center;justify-content:center}
#rec i{width:16px;height:16px;border-radius:50%;background:#fff}
#rec.on i{border-radius:3px;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(.7)}}
.tbtn{width:44px;border-radius:12px;background:var(--ctl);display:flex;align-items:center;justify-content:center}
#pause{background:var(--ink);color:#fff}
#pause .pp{display:none}#pause.playing .pp{display:block}#pause.playing .pl{display:none}
#metro{display:none}
#metro.on{background:#efb51f;color:#2c2c2c}

/* play area: clearly separated panel */
#play{grid-area:play;display:grid;grid-template-columns:clamp(112px,34%,150px) minmax(0,1fr);gap:10px;
  margin:4px calc(-8px - env(safe-area-inset-right)) 0 calc(-8px - env(safe-area-inset-left));
  padding:14px calc(12px + env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) calc(12px + env(safe-area-inset-left));
  background:var(--play);border-radius:26px 26px 0 0;box-shadow:0 -1px 0 #d4d0c8,0 -10px 28px rgba(0,0,0,.07);position:relative}
#play::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#cfcbc3}
#joyArea{display:flex;align-items:center;justify-content:center;min-height:0}
#joy{position:relative;width:min(100%,140px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 60%,#ecebe7,#d9d6cf 70%);box-shadow:inset 0 6px 12px rgba(0,0,0,.16),0 0 0 1px #d4d0c8;touch-action:none}
#joy .dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#b5b1a9}
#joy .dot.hot{background:var(--ink)}
#knob{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#55575c,#2a2b2e 55%,#141416);box-shadow:0 8px 10px rgba(0,0,0,.3),inset 0 2px 2px rgba(255,255,255,.25);will-change:transform;pointer-events:none}
#knob::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 50% 70%,#3a3b3f,#1c1d1f)}
#keys{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(0,.55fr) minmax(0,1fr);gap:7px;min-height:0;touch-action:none}
.cb{border-radius:14px;background:linear-gradient(180deg,#ffffff,#eeece7);box-shadow:0 4px 0 #cfccc5,0 6px 12px rgba(0,0,0,.08);
  color:#3f3f3f;font-size:22px;font-weight:700;position:relative;transition:transform .03s,box-shadow .03s;touch-action:none}
.cb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;padding:0 2px}
.cb .n{font-size:22px;line-height:1}
.cb .c{font-size:11px;font-weight:600;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.cb.top{grid-column:span 4}.cb.bot{grid-column:span 3}
.cb.down{transform:translateY(3px);background:linear-gradient(180deg,#f3f1ec,#e6e3dd);box-shadow:0 1px 0 #cfccc5}
.cb.locked::after{content:"";position:absolute;top:8px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--red)}
.cb.sel{box-shadow:0 4px 0 #cfccc5,0 6px 12px rgba(0,0,0,.08),inset 0 0 0 2px #1d1d1f22}
.cb.next{box-shadow:0 4px 0 #cfccc5,0 6px 12px rgba(0,0,0,.08),inset 0 0 0 3px #efb51f;animation:glow 1s ease-in-out infinite alternate}
.cb.next .c{color:#8a5d00}
@keyframes glow{to{background:linear-gradient(180deg,#fff7df,#f6ead0)}}

/* ---------- layout: landscape ---------- */
@media (orientation:landscape){
  #app{gap:8px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px);
    grid-template-columns:clamp(120px,19%,160px) minmax(0,1fr) clamp(120px,19%,160px);
    grid-template-rows:44px minmax(0,1fr) minmax(0,1.1fr);
    grid-template-areas:"top top top" "modes screen tracks" "joy keys transport"}
  #topbar{grid-area:top;display:flex;gap:6px;min-width:0}
  #bar{flex:1 1 250px;min-width:196px;gap:5px}
  .big{height:44px}.big b{font-size:12px;padding:0 2px}.big small{font-size:9px}
  #chord{flex:1 1 300px;min-width:268px}
  #lock{flex:0 0 40px}
  #joym{flex:1 1 210px;min-width:150px;height:44px}
  .seg .l{display:none}.seg .s{display:inline}
  #bar{flex-basis:250px}#inv{min-width:110px}
  #modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:5px;margin:0;padding:0;overflow:visible}
  .chip{height:auto;padding:0 2px;border-radius:10px;font-size:11px}
  .chip:disabled{display:none}
  #loop{display:contents}
  #tracks{grid-area:tracks;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:5px}
  .trk{max-width:none}
  #transport{grid-area:transport;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) 46px;gap:6px;margin:0}
  #rec{grid-column:1 / 4;width:auto;border-radius:16px}
  .tbtn{width:auto}
  #metro{display:flex}
  #play{display:contents}
  #play::before{display:none}
  #joyArea{grid-area:joy}
  #keys{grid-area:keys}
}

/* ---------- overlays ---------- */
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(244,243,240,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .4s;padding:24px}
#boot.hide{opacity:0;pointer-events:none}
#boot button{padding:16px 30px;border-radius:30px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#boot p{margin:0;font-size:13px;color:var(--mut);text-align:center;max-width:300px;line-height:1.4}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);display:none}
#sheet.open{display:block}
#sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:#fff;border-radius:22px 22px 0 0;padding:16px calc(18px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@media (orientation:landscape){#sheet .in{left:auto;top:0;width:min(440px,62%);max-height:none;border-radius:22px 0 0 22px;padding-top:calc(16px + env(safe-area-inset-top))}}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-h h2{margin:0;font-size:19px}
.x{width:36px;height:36px;border-radius:50%;background:var(--ctl);font-size:16px}
#sheet h3{margin:16px 0 8px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
#sheet p,#sheet li,#sheet td{font-size:14px;line-height:1.45;color:var(--txt)}
#sheet table{width:100%;border-collapse:collapse}#sheet td{padding:5px 4px;border-bottom:1px solid #eeece7;vertical-align:top}
#sheet td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.g{display:grid;gap:6px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.o{min-height:42px;border-radius:11px;background:var(--ctl);font-size:13px;font-weight:600;color:var(--txt);padding:4px 6px}
.o.sel{background:var(--ink);color:#fff}
.o.wide{width:100%}
.o small{display:block;font-size:11.5px;font-weight:400;opacity:.75;margin-top:2px;line-height:1.3}
.o.step{text-align:left;padding:9px 12px;line-height:1.3}
.pv{display:block;font-size:10.5px;font-weight:400;opacity:.7}
#sheet ol{margin:0;padding-left:20px}#sheet ol li{margin:3px 0}
.frow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0eee9}
.frow span{flex:1 1 auto;font-size:14px;font-weight:600}
.frow .v{min-width:96px;text-align:center;font-size:13px;font-weight:700}
.frow button{width:40px;height:38px;border-radius:10px;background:var(--ctl);font-size:18px}
.sl{display:flex;align-items:center;gap:10px;padding:6px 0}
.sl span{width:74px;font-size:13px;font-weight:600}
.sl input{flex:1 1 auto;accent-color:#1d1d1f}
.sl em{width:62px;text-align:right;font-style:normal;font-size:12px;color:var(--mut)}
.bpmv{font:700 54px Silkscreen,monospace;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <div id="screenWrap"><canvas id="scr"></canvas>
    <button id="helpBtn" aria-label="Guia"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6"></path><path d="M12 17h.01"></path></svg></button>
  </div>
  <div id="topbar">
    <div id="bar">
      <button class="big" id="tomB"><small>TOM</small><b id="tomV">C maior</b></button>
      <button class="big" id="bpmB"><small>BPM</small><b id="bpmV">100</b></button>
      <button class="big tap" id="tapB">TAP</button>
      <button class="big" id="somB"><small>SOM</small><b id="somV">Saw</b></button>
    </div>
    <div id="chord">
      <div class="seg" id="inv"><button data-i="0"><span class="l">Fund.</span><span class="s">F</span></button><button data-i="1"><span class="l">1ª inv</span><span class="s">1ª</span></button><button data-i="2"><span class="l">2ª inv</span><span class="s">2ª</span></button></div>
      <div id="oct"><button id="octD" aria-label="Oitava abaixo">−</button><span>OIT<br><b id="octV">0</b></span><button id="octU" aria-label="Oitava acima">+</button></div>
      <button id="lock" aria-label="Travar modificação do joystick (Chord Lock)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
    </div>
    <div class="seg" id="joym"><button data-j="0"><span class="l">STD</span><span class="s">STD</span></button><button data-j="1"><span class="l">EXT</span><span class="s">EXT</span></button><button data-j="2"><span class="l">CHROM</span><span class="s">CHR</span></button><button data-j="3"><span class="l">BORROW</span><span class="s">BRW</span></button><button data-j="4"><span class="l">OG</span><span class="s">OG</span></button></div>
  </div>
  <div id="modes"></div>
  <div id="loop">
    <div id="tracks"></div>
    <div id="transport">
      <button id="rec" aria-label="Gravar"><i></i></button>
      <button class="tbtn" id="pause" aria-label="Tocar ou pausar o looper">
        <svg class="pl" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
        <svg class="pp" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </button>
      <button class="tbtn" id="clear" aria-label="Apagar faixa (segure para apagar tudo)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg></button>
      <button class="tbtn" id="metro" aria-label="Metrônomo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l4 18H5z"></path><path d="M12 15l6-9"></path></svg></button>
    </div>
  </div>
  <div id="play">
    <div id="joyArea"><div id="joy"><div id="knob"></div></div></div>
    <div id="keys"></div>
  </div>
</div>

<div id="boot">
  <button id="powerOn">Ligar o HiChord</button>
  <p>Funciona em pé e deitado. Se não ouvir som, desligue o modo silencioso ou use fone.</p>
  <p>Primeira vez? Toque em <b>?</b> no canto da tela para abrir o guia.</p>
</div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
'use strict';
/* ================= DATA ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NOTE=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const mod12=n=>((n%12)+12)%12;
const SCALES=[['MAJOR',[0,2,4,5,7,9,11]],['MINOR',[0,2,3,5,7,8,10]],['HARM MIN',[0,2,3,5,7,8,11]],['MEL MIN',[0,2,3,5,7,9,11]],
 ['MAJ PENT',[0,2,4,7,9]],['MIN PENT',[0,3,5,7,10]],['BLUES',[0,3,5,6,7,10]],['DORIAN',[0,2,3,5,7,9,10]],['MIXOLYD',[0,2,4,5,7,9,10]],['LYDIAN',[0,2,4,6,7,9,11]]];
const SCSHORT=['MAJ','MIN','HMIN','MMIN','PENT','mPNT','BLUS','DOR','MIX','LYD'];
const MODES=['PLAY','STRUM','LEAD','DRONE','ARP','REPEAT','DRUMS','BEAT','SEQ','MIXER'];
const SEQ_RATES=['1/16','1/8','1/4','1/2','1/1'];
const ADSR={LONG:[800,1000,.7,2000],SHORT:[100,100,1,1000],SWELL:[800,300,.8,2000],PLUCK:[5,80,0,180],TOUCH:[25,260,.66,50],SUSTAIN:[200,300,.85,3000],KEYS:[5,1200,.55,700]};
const ADSR_N=Object.keys(ADSR);
const RATES={'1/1':4,'1/2':2,'1/4':1,'1/8':.5,'1/16':.25,'1/16T':1/6,'1/32':.125,'STUT':1/16};
const ARP_RATES=['1/1','1/2','1/4','1/8','1/16','1/16T','1/32','S8','S16'];
const REP_RATES=['1/4','1/8','1/16','1/16T','1/32','STUT'];
const STRUM=[['SLO',200],['MED',80],['FST',40]];
const ARP_PAT=['UP','DOWN','UP/DN','DN/UP','RAND','FINGER'];
const ARP_LAYER=['ARP ONLY','CHORD+ARP','RHYTHM+ARP'];
const KITS=['TIGHTKIT','x0x BOX','x9x BOX','LYNN KIT','KR-78','TRAP BOX'];
const STYLES=['ROCK','BREAK','DUB','FUNK','HOUSE','DEMBOW','SWING'];
const VARS=['ORIG','GHOST','16TH','PUSH','FILL','HALF','DBL','PERC'];
const JOYMODES=['DEFAULT','EXTEND','CHROM','BORROW','OG'];
const DRUMPAD=['KICK','KICK2','SNARE','HAT','TOM','BELL','OHAT'];
const DRUMNAME={KICK:'KICK',KICK2:'KICK 2',SNARE:'SNARE',HAT:'CL HAT',TOM:'TOM',BELL:'RIDE',OHAT:'OP HAT',RIM:'RIM'};
const AUTO_RATE={U:'1/4',R:'1/8',D:'1/16',L:'1/32',UR:'S8',UL:'S8',DR:'S16',DL:'1/16T'};

const SOUNDS=[
 {n:'SAW',o:[['sawtooth',1,-7,.5],['sawtooth',1,7,.5]],fc:7000,env:'LONG'},
 {n:'SAW BASS',o:[['sawtooth',1,0,.6],['square',.5,0,.4]],oct:-1,fc:1500,fq:5,fenv:[3200,700,.4],env:'SHORT'},
 {n:'SINE',o:[['sine',1,0,1]],g:1.2,env:'LONG'},
 {n:'TRIANGLE',o:[['triangle',1,0,1]],g:1.1,env:'LONG'},
 {n:'SQUARE',o:[['square',1,0,.6]],fc:5000,env:'SHORT'},

function makeVoice(midi,t,opt={}){

    const g=ac.createGain();g.gain.value=gain;o.connect(g);g.connect(dest);srcs.push(o);fp.push([o.frequency,ratio]);nodes.push(g);

  let[a,d,s,r]=ADSR[ADSR_N[st.adsr]];if(st.atk!=null)a=st.atk;if(st.rel!=null)r=st.rel;if(S.minA)a=Math.max(a,S.minA);

      const g=out.gain;if(g.cancelAndHoldAtTime)g.cancelAndHoldAtTime(tt);else{g.cancelScheduledValues(tt);g.setValueAtTime(g.value,tt);}

    setMidi(m,tt,gl){this.midi=m;const nf=mtof(m+(S.oct||0)*12);fp.forEach(([p,ra])=>{if(gl>0)p.setTargetAtTime(nf*ra,tt,gl/3);else p.setValueAtTime(nf*ra,tt);});}};

/* drums */
function noiseSrc(t,dur){const s=ac.createBufferSource();s.buffer=A.noise;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+dur+.05);return s;}

function drumHit(name,t,vel=1){
  const K=KITP[st.kit];const out=ac.createGain();out.gain.value=vel;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=K.lp;out.connect(lp);lp.connect(A.drumBus);
  const osc=(type,f)=>{const o=ac.createOscillator();o.type=type;o.frequency.value=f;return o;};
  const bq=(type,f,q=.7)=>{const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const gn=()=>ac.createGain();

    const[f0,f1,d]=K.k;const o=osc('sine',name==='KICK2'?f0*1.3:f0);o.frequency.setValueAtTime(name==='KICK2'?f0*1.3:f0,t);o.frequency.exponentialRampToValueAtTime(f1*(name==='KICK2'?1.15:1),t+Math.min(.12,d*.45));
    const g=gn();denv(g,t,1,name==='KICK2'?d*.6:d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);
    if(K.clk){const n=noiseSrc(t,.03),h=bq('highpass',3000),g2=gn();denv(g2,t,K.clk*.5,.018);n.connect(h);h.connect(g2);g2.connect(out);}

  } else if(name==='HAT'||name==='OHAT'){
    if(rt.ohG){try{rt.ohG.gain.cancelScheduledValues(t);rt.ohG.gain.setTargetAtTime(0,t,.008);}catch(e){}rt.ohG=null;}
    const d=name==='HAT'?K.hh:K.oh;const n=noiseSrc(t,d),h=bq('highpass',K.br),b=bq('peaking',K.br*1.2,1),g=gn();b.gain.value=6;denv(g,t,.45,d);n.connect(h);h.connect(b);b.connect(g);g.connect(out);if(name==='OHAT')rt.ohG=g;

    const o=osc('sine',K.tm[0]);o.frequency.setValueAtTime(K.tm[0],t);o.frequency.exponentialRampToValueAtTime(K.tm[0]*.6,t+K.tm[1]);const g=gn();denv(g,t,.9,K.tm[1]);o.connect(g);g.connect(out);o.start(t);o.stop(t+K.tm[1]+.05);
  } else if(name==='BELL'){
    const bp=bq('bandpass',3200,1.4),g=gn();denv(g,t,.32,.7);bp.connect(g);g.connect(out);

    const o=osc('triangle',1800),g=gn();denv(g,t,.5,.03);o.connect(g);g.connect(out);o.start(t);o.stop(t+.06);
  }

}

const seqs=new Set();

const mode=()=>MODES[st.mode];

/* ================= LOOPER ================= */
const MAXLEN=20;
const LP={tr:[0,1,2,3,4,5].map(()=>({buf:null,src:null,g:null,vol:.9,mute:false})),len:0,t0:0,bars:0,playing:false,cursor:0,armed:-1,job:null,off:null,calT:null,mixSel:0,metro:null};

function lpInit(){
  LP.tr.forEach(t=>{t.g=ac.createGain();t.g.gain.value=t.vol;t.g.connect(A.loopBus);});
  A.proc=ac.createScriptProcessor(2048,2,2);A.mixBus.connect(A.proc);
  const z=ac.createGain();z.gain.value=0;A.proc.connect(z);z.connect(ac.destination);
  // silent latency calibration: an impulse fed only to the recorder
  const b=ac.createBuffer(1,64,ac.sampleRate);b.getChannelData(0)[0]=4;const s=ac.createBufferSource();s.buffer=b;s.connect(A.proc);LP.calT=ac.currentTime+.4;s.start(LP.calT);
  A.proc.onaudioprocess=onProc;

function onProc(e){
  const ib=e.inputBuffer,L=ib.getChannelData(0),R=ib.numberOfChannels>1?ib.getChannelData(1):L,n=L.length,sr=ac.sampleRate;
  const pt=e.playbackTime||ac.currentTime;
  if(LP.off==null){if(LP.calT==null)return;for(let j=0;j<n;j++)if(L[j]>2){LP.off=LP.calT-(pt+j/sr);break;}
    if(LP.off==null&&ac.currentTime>LP.calT+1.5)LP.off=-2*n/sr;return;}
  const J=LP.job;if(!J||J.done)return;
  const tb=pt+LP.off;
  if(J.free&&J.start==null){if(J.phase!=='wait')return;
    for(let j=0;j<n;j++){if(Math.abs(L[j])>.015||Math.abs(R[j])>.015){J.start=tb+j/sr;J.end=J.start+MAXLEN;J.phase='rec';break;}}
    if(J.start==null)return;}
  if(J.phase!=='rec'){if(tb+n/sr>J.start)J.phase='rec';else return;}
  for(let j=0;j<n;j++){const idx=Math.round((tb+j/sr-J.start)*sr);if(idx<0)continue;if(idx>=J.cap)break;J.L[idx]=L[j];J.R[idx]=R[j];}

function newJob(track,o){

function finishJob(){

  let len=Math.round((J.end-J.start)*sr);if(!J.define&&LP.len)len=Math.round(LP.len*sr);len=Math.min(len,J.cap);
  if(len<sr*.25){toast('TOO SHORT');return;}
  const b=ac.createBuffer(2,len,sr),bl=b.getChannelData(0),br=b.getChannelData(1);bl.set(J.L.subarray(0,len));br.set(J.R.subarray(0,len));

  LP.tr[J.track].buf=b;
  if(J.define||!LP.len){LP.len=len/sr;LP.t0=J.start;LP.bars=J.bars||0;LP.playing=true;}
  if(!LP.playing)lpResume(true);else startTrack(J.track);
  toast('IN LOOP '+(J.track+1),'',900);
  if(rt.guide!=null)rt.hint=rt.guide<GUIDE.length-1?'PRONTO! ABRA O GUIA (?) > PASSO '+(rt.guide+2):'';

function startTrack(k,when){const t=LP.tr[k];if(!t.buf||!LP.len)return;stopTrack(k);when=when||ac.currentTime+.03;

function lpResume(quiet){const when=ac.currentTime+.05;LP.t0=when+.0875;LP.playing=true;

    if(d==='L'||d==='R'){rt.seqCur=Math.max(0,Math.min(st.seq.length,rt.seqCur+(d==='R'?1:-1)));return true;}
    if(d==='U'&&st.seq.length){const r=Math.min(4,st.seq.length);st.seq.splice(-r);rt.seqCur=Math.min(rt.seqCur,st.seq.length);toast('REMOVED',r+' STEPS',700);save();}
    return false;}
  if(m==='MIXER'){
    if(d==='L'||d==='R'){LP.mixSel=(LP.mixSel+(d==='R'?1:-1)+6)%6;return true;}
    if(d==='U'||d==='D'){const t=LP.tr[LP.mixSel];t.vol=Math.max(0,Math.min(1,Math.round((t.vol+(d==='U'?.1:-.1))*10)/10));setTrackGain(LP.mixSel);return true;}
    return false;}

function setCur(c){rt.lastChord=c.name;rt.curNotes=c.notes;rt.lastNotes=c.notes;}
function trigger(b){
  const m=effMode(),t=ac.currentTime+.005;if(rt.joyDir&&rt.held[rt.held.length-1]===b)rt.lastDir[b]=rt.joyDir;const c=buildChord(b);setCur(c);
  const list=c.bass!=null?[c.bass,...c.notes]:c.notes;
  if(m==='PLAY'||m==='STRUM'){
    rt.held.forEach(h=>{releaseList(rt.vb[h]);rt.vb[h]=null;});
    rt.vb[b]=playNotes(list,t,{strum:m==='STRUM'?STRUM[st.strum][1]/1000:0});
  } else if(m==='DRONE'){releaseList(rt.drone);rt.drone=playNotes(list,t);}
  else if(m==='ARP'){ if(st.arpLayer===1){releaseList(rt.arpPad);rt.arpPad=playNotes(c.notes,t,{level:lvl(c.notes.length)*.45});} }
}
function leadNote(b){const off={U:12,D:-12,R:1,L:-1,UR:13,UL:11,DR:-11,DL:-13}[rt.joyDir]||0;return keyBase()+rt.bOct[b]*12+scaleNote(b)+off;}
function updateLead(){

function arpList(){
  const ns=rt.curNotes.slice().sort((a,b)=>a-b),up=ns.concat(ns.map(n=>n+12)),dn=up.slice().reverse();
  const top=ns[ns.length-1],mid=ns[1]!=null?ns[1]:ns[0],fp=ns.length?[ns[0],top,mid,top,ns[0]+12,top,mid,top]:[];
  return [up,dn,up.concat(dn.slice(1,-1)),dn.concat(up.slice(1,-1)),up,fp][st.arpPat]||up;
}
function startArp(){
  stopArp();

    const l=arpList();if(!l.length)return;const n=st.arpPat===4?l[Math.floor(Math.random()*l.length)]:l[i%l.length];
    makeVoice(n,t,{level:.24,dur:Math.max(.04,rateSec(ARP_RATES[st.arpRate],i)*.7),pan:st.stereo?(Math.random()-.5)*.5:0});rt.arpI=i;}});

function startAuto(b){stopAuto();const r=AUTO_RATE[rt.joyDir];rt.autoRate=r;rt.auto=addSeq({dur:i=>rateSec(r,i),tick:(t,i)=>drumHit(DRUMPAD[b],t,i?.8:1)});}
function stopAuto(){delSeq(rt.auto);rt.auto=null;rt.autoRate='';}
function beatHits(step,bar){
  const P=BEATS[STYLES[st.style]],v=st.variation;const src=v===6?(step*2)%16:step;
  const ch=(r,s=src)=>(P[r]||'')[s]||'.';const hits=[];
  const add=(n,c)=>{if(c==='x')hits.push([n,1]);else if(c==='g')hits.push([n,.3]);};
  let k=ch('k'),s=ch('s');
  if(v===5){k=(step===0||(step===10&&ch('k',10)==='x'))?'x':'.';s=step===8?'x':'.';}
  if(v===3&&(step===7||step===14))k='x';
  if(v===1&&s==='.'&&[7,9,15].includes(step))s='g';
  add('KICK',k);add('SNARE',s);
  let h=ch('h');if(v===2||v===6)h='x';add('HAT',h);
  add('OHAT',ch('o'));add('BELL',ch('b'));add('RIM',ch('p'));
  if(v===7&&'..x..x....x..x..'[step]==='x')hits.push(['BELL',.6]);
  if(v===4&&bar%2===1&&step>=12){hits.push(['SNARE',.5+(step-12)*.15]);if(step%2===0)hits.push(['TOM',.8]);}
  return hits;
}
function startBeat(at){
  stopBeat();const sw=STYLES[st.style]==='SWING';
  if(at==null&&LP.len&&LP.playing)at=nextBoundary(ac.currentTime+.05)-0;
  rt.beat=addSeq({next:at!=null&&at-ac.currentTime<4*beat()?at:undefined,dur:i=>{if(sw){return beat()*[1/3,1/3,1/6,1/6][i%4];}return beat()/4;},
    tick:(t,i)=>{const step=i%16,bar=Math.floor(i/16);for(const[n,v]of beatHits(step,bar))drumHit(n,t,v*(n==='HAT'&&step%2?.7:1));
      const d=(t-ac.currentTime)*1000;setTimeout(()=>rt.beatStep=step,Math.max(0,d));}});
}

function chordDown(b){

  if(st.prog>=0&&isChordMode()&&rt.held.length===1){const P=PROGS[st.prog][1];if(b===P[rt.progPos%P.length])rt.progPos=(rt.progPos+1)%P.length;}
  if(m==='DRUMS'){drumHit(DRUMPAD[b],ac.currentTime+.003);if(rt.joyDir)startAuto(b);return;}
  if(m==='BEAT'){if(st.style===b&&rt.beat){stopBeat();toast('STOP');}else{st.style=b;startBeat();save();}return;}
  if(m==='LEAD'){updateLead();return;}
  if(mode()==='SEQ'&&!rt.seqPlay){rt.seqPending=b;rt.seqDir=rt.joyDir||null;}

function chordUp(b){

function reshape(){

function defaultName(){return NOTE[st.key]+([1,2,3,5].includes(st.scale)?'min':'maj');}
function loopStatus(){const J=LP.job;if(J)return J.phase==='rec'?'REC '+(J.track+1):J.phase==='wait'?'WAITING':J.phase==='count'?'COUNT IN':'REC ARMED';
  if(hasLoops())return LP.playing?'LOOP':'PAUSED';return '';}

function overlay(a,b,bigNum){
  const w=Math.min(SW*.72,260),h=b?(bigNum?78:60):42,x=(SW-w)/2,y=(SH-h)/2;
  sg.fillStyle='rgba(29,29,31,.94)';rrect(x,y,w,h,12);sg.fill();

function trackIcon(k,cx,cy,s,fill,color){sg.fillStyle=color;sg.strokeStyle=color;sg.lineWidth=1.6;sg.beginPath();
  if(k<2)sg.arc(cx,cy,s/2,0,Math.PI*2);else if(k<4)sg.rect(cx-s/2,cy-s/2,s,s);else{sg.moveTo(cx,cy-s/2-1);sg.lineTo(cx+s/2+1,cy+s/2);sg.lineTo(cx-s/2-1,cy+s/2);sg.closePath();}
  fill?sg.fill():sg.stroke();}
function drawLoopBar(x,y,w){
  const bl=Math.floor(performance.now()/250)%2,J=LP.job;
  for(let k=0;k<6;k++){const cx=x+5+k*17,t=LP.tr[k];const rec=J&&J.track===k;
    if(rec&&J.phase!=='rec'&&!bl)continue;
    trackIcon(k,cx,y-4,8,rec?(J.phase==='rec'&&bl):!!t.buf&&!t.mute,rec?RED:t.buf?INK:'#a7a39b');
    if(LP.cursor===k){sg.fillStyle=INK;sg.fillRect(cx-5,y+3,10,1.5);}}
  const px0=x+6*17+8;sg.fillStyle=LINE;sg.fillRect(px0,y-5,w-(px0-x),3);
  if(LP.len&&LP.playing&&ac){const ph=(((ac.currentTime-LP.t0)%LP.len)+LP.len)%LP.len/LP.len;sg.fillStyle=J?RED:INK;sg.fillRect(px0,y-5,(w-(px0-x))*ph,3);}
}
function drawPiano(x,y,w,h,notes){
  const lo=notes.length?12*Math.floor(Math.min(...notes)/12):12*Math.floor(keyBase()/12);
  const wk=w/14,set=new Set(notes),WH=[0,2,4,5,7,9,11];let i=0;
  for(let o=0;o<2;o++)for(const pc of WH){const on=set.has(lo+o*12+pc),xx=x+i*wk;sg.fillStyle=on?INK:'#fff';sg.fillRect(xx,y,wk,h);sg.strokeStyle=INK;sg.lineWidth=1;sg.strokeRect(xx+.5,y+.5,wk-1,h-1);i++;}
  const BL={1:0,3:1,6:3,8:4,10:5};
  for(let o=0;o<2;o++)for(const pc of[1,3,6,8,10]){const on=set.has(lo+o*12+pc),wi=o*7+BL[pc],bx=x+(wi+1)*wk-wk*.3;sg.fillStyle=on?RED:'#bdb9b1';sg.fillRect(bx,y,wk*.6,h*.6);}
}
const CDIRS=[['U',0,-1],['UR',.8,-.6],['R',1,0],['DR',.8,.6],['D',0,1],['DL',-.8,.6],['L',-1,0],['UL',-.8,-.6]];
function drawCompass(x,y,w,h){
  const cx=x+w/2,cy=y+h/2,r=Math.min(w,h)/2;
  const b=rt.held.length?rt.held[rt.held.length-1]:rt.selBtn;const cur=rt.held.includes(b)?btnDir(b):null,lock=rt.locks[b];
  const px=Math.max(9,Math.min(12,Math.floor(r/6)));
  sg.strokeStyle=LINE;sg.lineWidth=1;
  for(const[d,dx,dy]of CDIRS){sg.beginPath();sg.moveTo(cx+dx*6,cy+dy*6);sg.lineTo(cx+dx*r*.38,cy+dy*r*.38);sg.stroke();}
  sg.fillStyle=INK;sg.fillRect(cx-2.5,cy-2.5,5,5);
  txt('BTN '+(b+1),cx,cy+16,8,{align:'center',color:MUTED});
  for(const[d,dx,dy]of CDIRS){
    const name=chordFor(b,d).name;let fx=fitPx(name,r*.95,px,false);
    const al=dx>.1?'right':dx<-.1?'left':'center';const tx=dx>.1?cx+r:dx<-.1?cx-r:cx;const ty=cy+dy*(r-px*.6)+px*.35;
    const ww=tw(name,fx),bx=al==='right'?tx-ww:al==='left'?tx:tx-ww/2;
    if(d===cur){sg.fillStyle=INK;rrect(bx-3,ty-fx-1,ww+6,fx+5,3);sg.fill();txt(name,tx,ty,fx,{align:al,color:'#fff'});}
    else txt(name,tx,ty,fx,{align:al,color:INK});
    if(d===lock){sg.fillStyle=RED;sg.beginPath();sg.arc(al==='right'?bx-7:al==='left'?bx+ww+7:bx+ww+7,ty-fx*.4,2.5,0,Math.PI*2);sg.fill();}
  }
}
function drawChord(x,y,w,h,m){
  const lead=m==='LEAD',showC=!lead&&w>250&&h>70;
  const cw=showC?Math.min(h*1.25,w*.46):0,lw=w-cw-(showC?14:0);

  const name=rt.lastChord||defaultName();

  if(notes.length){yy+=17;txt([...new Set(notes.map(n=>NOTE[mod12(n)]))].join(' · '),x,yy,10,{color:MUTED});}
  if(pianoH>=14)drawPiano(x,yy+8,Math.min(lw,14*24),pianoH,notes);

}
function drawProg(x,y){
  if(st.prog<0||!isChordMode())return 0;const P=PROGS[st.prog][1],nx=rt.progPos%P.length;let xx=x;
  txt('PROG',xx,y,9,{color:MUTED});xx+=tw('PROG',9)+6;

function stepGrid(x,y,w,h,n,filledFn,curIdx,cursor){
  const g=4,cell=(w-15*g)/16;

    else if(filledFn(i)){sg.strokeStyle=INK;sg.lineWidth=1.5;sg.strokeRect(cx+.75,y+.75,cell-1.5,h-1.5);}
    else{sg.fillStyle=i%4===0?'#e2dfd8':'#eeece7';sg.fillRect(cx,y,cell,h);}
    if(i===cursor){sg.fillStyle=RED;sg.fillRect(cx,y+h+3,cell,2);}}
}
function drawBeat(x,y,w,h){

function drawSeq(x,y,w,h){

function drawMixer(x,y,w,h){

  const end=()=>clearTimeout(t);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerleave',end);
  el.addEventListener('click',e=>{if(fired){fired=false;return;}if(rt.on||el.dataset.free)tap(e);});}

      +slider('Attack','atk',0,1000,1,Math.round(Math.log(attackV()+1)/Math.log(3001)*1000),attackV()+' ms')
      +slider('Release','rel',0,1000,1,Math.round(Math.log(releaseV()+1)/Math.log(5001)*1000),releaseV()+' ms')
      +slider('Filtro','cut',0,100,1,Math.round(st.cutoff*100),st.filter?Math.round(cutoffHz())+' Hz':'desligado');
    h+='<h3>Efeitos e ajustes</h3>'+FX.filter(f=>!['joy','loopLen','metro'].includes(f.k)).map(f=>`<div class="frow"><span>${titleCase(f.n)}</span><button data-a="fx" data-k="${f.k}" data-v="-1" aria-label="Anterior">‹</button><b class="v">${f.o[st[f.k]]}</b><button data-a="fx" data-k="${f.k}" data-v="1" aria-label="Próximo">›</button></div>`).join('');
    h+='<h3>Aleatório</h3>'+o('Sortear som e efeitos','rand',1,false,'wide');
  } else if(k==='modo'){
    const md=mode();h+=head('Modo '+MODE_LBL[st.mode]);
    if(md==='PLAY')h+='<p>Toca o acorde inteiro. Segure dois botões para baixo invertido (ex.: segure 1 e toque 6 = Am/C).</p>';
    if(md==='STRUM')h+='<h3>Velocidade do rasgueado</h3><div class="g g3">'+STRUM.map((s,i)=>o(['Lento','Médio','Rápido'][i],'strum',i,st.strum===i)).join('')+'</div>';
    if(md==='LEAD')h+='<p>Uma nota por tecla (o nome aparece na tecla): ideal para baixo e melodia por cima de um loop. O joystick sobe/desce a oitava (↑↓) ou o semitom (← →). Use GLIDE em Som para deslizar.</p>';
    if(md==='DRONE')h+='<p>O acorde continua soando depois de soltar, até tocar outro ou trocar de modo.</p>';
    if(md==='ARP')h+='<h3>Padrão</h3><div class="g g3">'+ARP_PAT.map((s,i)=>o(s,'arpPat',i,st.arpPat===i)).join('')+'</div><h3>Velocidade</h3><div class="g g3">'+ARP_RATES.map((s,i)=>o(s,'arpRate',i,st.arpRate===i)).join('')+'</div><h3>Camadas</h3><div class="g g3">'+ARP_LAYER.map((s,i)=>o(s,'arpLayer',i,st.arpLayer===i)).join('')+'</div>';
    if(md==='REPEAT')h+='<h3>Velocidade</h3><div class="g g3">'+REP_RATES.map((s,i)=>o(s,'repRate',i,st.repRate===i)).join('')+'</div>';
    if(md==='DRUMS')h+='<h3>Kit</h3><div class="g g3">'+KITS.map((s,i)=>o(s,'kit',i,st.kit===i)).join('')+'</div><p>Pads: 1 bumbo · 2 bumbo 2 · 3 caixa · 4 chimbal · 5 tom · 6 ride · 7 chimbal aberto. Segure um pad e incline o joystick para repetir sozinho.</p>';
    if(md==='BEAT')h+='<h3>Estilo (ou toque o botão 1–7)</h3><div class="g g3">'+STYLES.map((s,i)=>o(s,'style',i,st.style===i)).join('')+'</div><h3>Variação</h3><div class="g g4">'+VARS.map((s,i)=>o(s,'variation',i,st.variation===i)).join('')+'</div><div style="height:8px"></div>'+o(rt.beat?'Parar beat':'Tocar beat','beatToggle',0,!!rt.beat,'wide')+'<div style="height:6px"></div>'+o('Gravar beat no looper','bounce',0,false,'wide');
    if(md==='SEQ')h+='<p>Com o sequencer parado, cada acorde tocado vira um passo (até 16).</p><h3>Duração do passo</h3><div class="g g3">'+SEQ_RATES.map((s,i)=>o(s,'seqRate',i,st.seqRate===i)).join('')+'</div><div style="height:8px"></div><div class="g g2">'+o(rt.seqPlay?'Parar':'Tocar','seqToggle',0,!!rt.seqPlay)+o('Apagar últimos 4','seqDel4',0)+'</div><div style="height:6px"></div>'+o('Apagar sequência','seqClear',0,false,'wide');
    if(md==='MIXER')h+='<p>Teclas 1–6 silenciam/reativam as faixas, a 7 liga o metrônomo. Joystick ← → escolhe a faixa e ↑ ↓ ajusta o volume.</p>'+LP.tr.map((t,i)=>t.buf?`<div class="frow"><span>Faixa ${i+1}</span><input type="range" data-a="tvol" data-k="${i}" min="0" max="100" value="${Math.round(t.vol*100)}" style="flex:1 1 auto;accent-color:#1d1d1f"><button data-a="mute" data-k="${i}" class="${t.mute?'o sel':''}" style="width:56px;font-size:12px;font-weight:700">${t.mute?'MUTE':'ON'}</button></div>`:'').join('')||'<p>Grave algo no looper primeiro.</p>';
    if(md!=='MIXER')h+='<h3>Aleatório</h3>'+o('Sortear padrão do modo','rand',2,false,'wide');
  } else if(k==='help'){
    const jb=rt.selBtn,std=st.joy===0;
    h+=head('Guia');
    h+=`<h3>Comece por aqui</h3><ol>
<li>Toque as 7 teclas: cada uma é um grau do tom (o nome do acorde aparece nela). Em C: C, Dm, Em, F, G, Am, Bdim.</li>
<li>Siga uma progressão guiada abaixo, segurando cada acorde por 4 tempos.</li>
<li>Segure um acorde e incline o joystick para mudar o tipo dele.</li>
<li>Troque de som em <b>Som</b> e experimente Strum, Lead e Arp.</li>
<li>Grave camadas no looper e equilibre no Mixer (exercício no fim).</li></ol>`;
    h+='<h3>Progressões guiadas</h3>'+progButtons();
    h+=`<h3>Joystick · tecla ${jb+1} agora (${JOYMODES[st.joy]})</h3><table>`+JOY_ROWS.map(([d,ar,c])=>`<tr><td>${ar}</td><td><b>${chordFor(jb,d).name}</b>${std?' · '+c:''}</td></tr>`).join('')+`</table>
<p>Ao soltar, o acorde volta ao normal. Segure acorde + direção por 1 s (ou use o cadeado) para travar a mudança na tecla (Chord Lock).</p>`;
    h+='<h3>Exercício: música do zero</h3><p>Pop/lo-fi em C, 90 BPM, loop de 4 compassos. Cada passo prepara som e modo; depois é só tocar e gravar. Ao terminar uma faixa, volte aqui para o próximo.</p>'
      +GUIDE.map((g,i)=>o(`${i+1}. ${g.t}<small>${g.d}</small>`,'guide',i,rt.guide===i,'wide step')).join('<div style="height:5px"></div>')
      +(rt.guide!=null?'<div style="height:8px"></div>'+o('Sair do exercício','guideExit',0,false,'wide'):'');
    h+=`<h3>Onde fica cada coisa</h3>
<table><tr><td>Tom</td><td>Tonalidade, escala, oitava geral, progressão guiada.</td></tr>
<tr><td>BPM · TAP</td><td>Tempo, tamanho do loop e metrônomo. TAP: toque no ritmo.</td></tr>
<tr><td>Som</td><td>Presets P1–P4, timbres, Attack/Release/Filtro e efeitos.</td></tr>
<tr><td>Modos</td><td>Toque para trocar; toque de novo no ativo para ver as opções.</td></tr>
<tr><td>Inv · Oit · Cadeado</td><td>Valem para a última tecla tocada (contornada).</td></tr>
<tr><td>STD … OG</td><td>Modo do joystick: Default, Extend, Chromatic, Borrow, OG.</td></tr>
<tr><td>Duas teclas</td><td>Segure a do baixo e toque o acorde: 1 + 6 = Am/C.</td></tr>
<tr><td>Faixas ● ■ ▲</td><td>Toque para escolher; segure para apagar.</td></tr>
<tr><td>Gravar</td><td>Grava na faixa escolhida (ou na próxima vazia), com contagem de 4.</td></tr>
<tr><td>Clique no joystick</td><td>Seq: tocar/parar · Beat: gravar no looper.</td></tr></table>
<p>Fora desta versão: Chord Hiro, Ear Trainer, Tuner, microfone e MIDI.</p>`;
  }
  sheetIn.innerHTML=h;
}
function openSheet(k){sheetKind=k;renderSheet();sheet.classList.add('open');sheetIn.scrollTop=0;}
function closeSheet(){sheet.classList.remove('open');sheetKind=null;}
sheet.addEventListener('click',e=>{if(e.target===sheet){closeSheet();return;}
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a,v=+b.dataset.v;
  switch(a){
    case'close':closeSheet();return;
    case'key':st.key=v;break;case'scale':setFx('scale',v);break;case'goct':st.octave=Math.max(-2,Math.min(2,st.octave+v));break;
    case'rand':randomize(v);break;case'bpm':st.bpm=Math.max(40,Math.min(300,st.bpm+v));applyFX();break;case'tap':tapTempo();break;
    case'loopLen':st.loopLen=v;break;case'metro':st.metro=st.metro?0:1;break;
    case'sound':setSound(v);break;case'fx':setFx(b.dataset.k,st[b.dataset.k]+v);break;
    case'strum':st.strum=v;break;case'arpPat':st.arpPat=v;break;case'arpRate':st.arpRate=v;break;case'arpLayer':st.arpLayer=v;break;
    case'repRate':st.repRate=v;break;case'kit':st.kit=v;break;
    case'style':st.style=v;if(rt.beat)startBeat();break;case'variation':st.variation=v;break;
    case'beatToggle':if(rt.beat)stopBeat();else startBeat();break;case'bounce':bounceBeat();break;
    case'seqRate':st.seqRate=v;break;case'seqToggle':if(rt.seqPlay)stopSeq();else startSeqPlay();break;
    case'seqDel4':st.seq.splice(-4);rt.seqCur=Math.min(rt.seqCur,st.seq.length);break;case'seqClear':st.seq=[];rt.seqCur=0;stopSeq();break;
    case'prog':setProg(v);break;
    case'guide':applyGuide(v);return;
    case'guideExit':exitGuide();break;
    case'pload':loadPreset(v);break;case'psave':savePreset(v);break;
    case'mute':{const t=LP.tr[+b.dataset.k];t.mute=!t.mute;setTrackGain(+b.dataset.k);break;}
    default:return;}
  applyFX();save();renderSheet();});
sheet.addEventListener('input',e=>{const i=e.target;if(!i.dataset||!i.dataset.a)return;const v=+i.value,em=i.parentElement.querySelector('em');
  switch(i.dataset.a){
    case'vol':st.volume=v/100;if(em)em.textContent=v+'%';break;
    case'atk':st.atk=Math.round(Math.pow(3001,v/1000)-1);if(em)em.textContent=st.atk+' ms';break;
    case'rel':st.rel=Math.round(Math.pow(5001,v/1000)-1);if(em)em.textContent=st.rel+' ms';break;
    case'cut':st.cutoff=v/100;st.filter=1;if(em)em.textContent=Math.round(cutoffHz())+' Hz';break;
    case'tvol':{const k=+i.dataset.k;LP.tr[k].vol=v/100;setTrackGain(k);break;}}
  applyFX();save();});

/* ================= INPUT: keys + joystick ================= */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('#sheet .in')&&!e.target.closest('#modes'))e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
const owners=new Map();
function pressEl(el){if(!el)return null;const cb=el.closest&&el.closest('.cb');return cb?{idx:+cb.dataset.b,el:cb}:null;}
function startPress(id,o){if(!o||!rt.on)return;for(const v of owners.values())if(v.el===o.el)return;owners.set(id,o);o.el.classList.add('down');rt.selBtn=o.idx;chordDown(o.idx);}
function endPress(id){const o=owners.get(id);if(!o)return;owners.delete(id);o.el.classList.remove('down');chordUp(o.idx);}
document.addEventListener('touchstart',e=>{let hit=false;for(const t of e.changedTouches){const o=pressEl(document.elementFromPoint(t.clientX,t.clientY)||t.target);if(o){hit=true;startPress('t'+t.identifier,o);}}if(hit)e.preventDefault();},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches)endPress('t'+t.identifier);};
document.addEventListener('touchend',tEnd);document.addEventListener('touchcancel',tEnd);
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;const o=pressEl(e.target);if(o){e.preventDefault();startPress('p'+e.pointerId,o);}});
const pEnd=e=>{if(e.pointerType!=='touch')endPress('p'+e.pointerId);};
document.addEventListener('pointerup',pEnd);document.addEventListener('pointercancel',pEnd);
window.addEventListener('blur',()=>{for(const id of[...owners.keys()])endPress(id);});

const joy=$('#joy'),knob=$('#knob');const DIRS=['R','DR','D','DL','L','UL','U','UR'];
DIRS.forEach((d,i)=>{const a=i*Math.PI/4,el=document.createElement('div');el.className='dot';el.dataset.d=d;el.style.left=(50+Math.cos(a)*45)+'%';el.style.top=(50+Math.sin(a)*45)+'%';joy.appendChild(el);});
let jp=null;
function setDir(d){
  if(d===rt.joyDir)return;rt.joyDir=d;
  $$('#joy .dot').forEach(e=>e.classList.toggle('hot',e.dataset.d===d));
  if(!rt.on)return;clearTimeout(rt.navRep);
  const m=mode();
  if(!rt.held.length){if(d&&idleNav(d)){const rep=()=>{if(rt.joyDir!==d)return;idleNav(d);rt.navRep=setTimeout(rep,140);};rt.navRep=setTimeout(rep,420);}return;}
  if(rt.seqPending!=null&&d)rt.seqDir=d;
  if(m==='DRUMS'){const b=rt.held[rt.held.length-1];if(d)startAuto(b);else stopAuto();return;}
  if(m==='BEAT'){if(d==='U'||d==='D'){st.variation=(st.variation+(d==='U'?1:-1)+8)%8;toast('VARIANT',VARS[st.variation]);save();}return;}
  reshape();armLock(rt.held[rt.held.length-1]);
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();if(jp)return;try{joy.setPointerCapture(e.pointerId)}catch(_){}
  const r=joy.getBoundingClientRect();jp={id:e.pointerId,cx:r.left+r.width/2,cy:r.top+r.height/2,R:r.width*.22,t:performance.now(),max:0};
  const me=jp;jp.holdT=setTimeout(()=>{if(jp===me&&me.max<.3){me.held=true;joyHold();}},700);moveJoy(e);});
function moveJoy(e){if(!jp||e.pointerId!==jp.id)return;let dx=e.clientX-jp.cx,dy=e.clientY-jp.cy;const R=jp.R,mag=Math.hypot(dx,dy);
  if(mag>R){dx*=R/mag;dy*=R/mag;}const n=Math.min(1,mag/R);jp.max=Math.max(jp.max,n);
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  if(n<(rt.joyDir?.42:.5))setDir(null);else{const i=Math.round(Math.atan2(dy,dx)/(Math.PI/4));setDir(DIRS[(i+8)%8]);}}
joy.addEventListener('pointermove',moveJoy);
const joyUp=e=>{if(!jp||e.pointerId!==jp.id)return;const click=!jp.held&&performance.now()-jp.t<300&&jp.max<.3;clearTimeout(jp.holdT);jp=null;knob.style.transform='';setDir(null);clearTimeout(rt.navRep);if(click)joyClick();};
joy.addEventListener('pointerup',joyUp);joy.addEventListener('pointercancel',joyUp);

/* ================= BOOT + LOOP ================= */
$('#powerOn').addEventListener('click',async()=>{
  if(!ac)initAudio();try{await ac.resume();}catch(e){}
  const b=ac.createBufferSource();b.buffer=ac.createBuffer(1,1,22050);b.connect(ac.destination);b.start();
  $('#boot').classList.add('hide');rt.on=true;rt.boot=performance.now()+1400;
  const t=ac.currentTime+.3;[60,64,67,72].forEach((n,i)=>makeVoice(n,t+i*.09,{level:.12,dur:.25}));
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state!=='running')ac.resume().catch(()=>{});});
document.addEventListener('pointerdown',()=>{if(ac&&ac.state!=='running')ac.resume().catch(()=>{});},true);
try{new ResizeObserver(resizeScreen).observe($('#screenWrap'));}catch(e){addEventListener('resize',resizeScreen);}
addEventListener('orientationchange',()=>setTimeout(resizeScreen,250));
resizeScreen();paintLocks();
let lastSync=0;
function loop(t){drawScreen();if(t-lastSync>90){syncUI();lastSync=t;}requestAnimationFrame(loop);}
(document.fonts?document.fonts.load('10px Silkscreen'):Promise.resolve()).catch(()=>{}).finally(()=>{});
requestAnimationFrame(loop);
</script>
</body>
